# Repository-specific identifiers, quotations and deliberate fixtures.

schema = 1

[oxford]
stems = []

[words]
accepted = []

[words.corrections]

[patterns]
ignore = [
  # Fixed Pylint dependency name in Make variables.
  '\bASTROID_VERSION\b',
  # External colour-control environment variables used by markdownlint-cli2.
  '\b(?:FORCE_COLOR|NO_COLOR)\b',
  # Inline code spans were masked by the previous dictionary snapshot; kept
  # until the shared dictionary rules on it.
  '`[^`\n]+`',
]

[files]
exclude = []
